[project]
name = "jev-classifier"
version = "0.1.0"
description = "Local, staged support-triage cascade built on Laya-MLX typed decision models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laya-mlx>=0.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
jev-classify = "jev_classifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_classifier"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
